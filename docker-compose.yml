# Run Compass on a server (e.g. an NVIDIA DGX). See docs/DEPLOY_DGX.md.
#
#   cp .env.production.example .env.production   # then edit it
#   docker compose up -d --build
#   docker compose run --rm compass pnpm db:seed  # first time only

services:
  compass:
    build: .
    image: compass-planner:latest
    container_name: compass
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: file:/data/compass.db
    ports:
      # Change the left number to serve on another port, e.g. "8080:3000".
      - "3000:3000"
    volumes:
      - compass-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Optional front door so people use a name (and no ":3000"). Off unless you ask for it:
  #   docker compose --profile domain up -d
  # Set COMPASS_SITE_ADDRESS in .env.production first. See "Use a domain name" in docs/DEPLOY_DGX.md.
  proxy:
    image: caddy:2
    container_name: compass-proxy
    profiles: ["domain"]
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - compass

volumes:
  # The database lives here and survives rebuilds and restarts. Back it up (see the guide).
  compass-data:
  # HTTPS certificates issued for the domain proxy.
  caddy-data:
  caddy-config:
